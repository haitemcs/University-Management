services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: university_db
      POSTGRES_USER: university
      POSTGRES_PASSWORD: university
    ports:
      - "5432:5432"
    volumes:
      - university_data:/var/lib/postgresql/data
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_analytics.sql:/docker-entrypoint-initdb.d/02_analytics.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U university -d university_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://university:university@db:5432/university_db
      SECRET_KEY: change-this-secret-before-deployment
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  university_data:
